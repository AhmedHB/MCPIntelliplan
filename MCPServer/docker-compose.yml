services:
  db:
    image: postgres:16
    container_name: intelliplan-postgres
    environment:
      POSTGRES_DB: intelliplan
      POSTGRES_USER: intelliplan
      POSTGRES_PASSWORD: intelliplan
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliplan -d intelliplan"]
      interval: 5s
      timeout: 5s
      retries: 20

