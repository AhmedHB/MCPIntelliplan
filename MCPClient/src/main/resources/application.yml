spring:
  application:
    name: MCPClient

  #main:
    #web-application-type: none

  ai:
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0
          max-tokens: 5000
          #top-k: 10

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          #model: llama3.1:8b
          model: qwen2.5:7b
          #model: qwen2.5:14b
          temperature: 0
          max-tokens: 5000
          #top-k: 3

    #Remote
 #   ollama:
 #     base-url: http://192.168.50.8:11434
 #     chat:
 #       options:
 #         model: qwen2.5:32b
 #         temperature: 0
 #         max-tokens: 5000

    mcp:
      client:
        toolcallback:
          enabled: true
        sse:
          connections:
            intelliplan:
              url: http://localhost:9090/sse

    vectorstore:
      milvus:
        initialize-schema: true
        client:
          host: localhost
          port: 19530
          username: root
          password: Milvus
        database-name: default
        collection-name: chat_memory_store
        index-type: IVF_FLAT
        metric-type: COSINE

logging:
  level:
    io.modelcontextprotocol.client: WARN
    io.modelcontextprotocol.spec: WARN
    com.zaxxer.hikari: ERROR   # 👈 döljer shutdown-meddelandet

  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: 8080
